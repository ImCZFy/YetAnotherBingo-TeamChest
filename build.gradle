plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.11' apply false
    id "com.modrinth.minotaur" version "2.+" apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'com.modrinth.minotaur'

    group = project.maven_group
    if (project.name == "mc26.1") {
        version = project.mod_version_26_1
    } else if (project.name == "mc26.2") {
        version = project.mod_version_26_2
    } else {
        version = project.findProperty("mod_version_26_2") ?: "0.0.0"
    }

    repositories {
        mavenCentral()
        maven {
            name = "Yet Another Bingo"
            url = "https://gitlab.com/api/v4/projects/48318565/packages/maven"
            content {
                includeGroup("me.jfenn.bingo")
            }
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "LuckPerms"
            url = "https://repo.lucko.me/"
            content {
                includeGroup("me.lucko")
            }
        }
    }

    if (project.name != 'common') {
        apply plugin: 'net.fabricmc.fabric-loom'

        def bingoApiVersion = project.name == "mc26.2" ? "2.11.0" : "2.10.0"
        def minecraftDependency = project.name == "mc26.2" ? ">=26.2" : ">=26.1"
        def fabricLoaderDependency = project.name == "mc26.2" ? ">=0.19.3" : ">=0.15.0"

        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
            implementation "me.jfenn.bingo:api:${bingoApiVersion}"
        }

        tasks.named("jar").configure {
            destinationDirectory.set(file("${rootProject.projectDir}/build/libs"))
        }

        tasks.matching { it.name == "remapJar" }.configureEach {
            destinationDirectory.set(file("${rootProject.projectDir}/build/libs"))
        }

        processResources {
            inputs.property "version", project.version
            inputs.property "minecraft_dependency", minecraftDependency
            inputs.property "fabric_loader_dependency", fabricLoaderDependency

            filesMatching("fabric.mod.json") {
                expand(
                        "version": project.version,
                        "minecraft_dependency": minecraftDependency,
                        "fabric_loader_dependency": fabricLoaderDependency
                )
            }
        }

        afterEvaluate {
            def remapJarTask = tasks.findByName("remapJar")
            def uploadTask = remapJarTask ?: tasks.named("jar").get()

            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                projectId = "LzfWcB6J"
                versionNumber = "${project.version}-${project.name}"
                versionType = "release"
                uploadFile = uploadTask
                gameVersions = [project.name.replace("mc", "")]
                loaders = ["fabric"]
                dependencies {
                    required.project "fabric-api"
                    required.project "yet-another-minecraft-bingo"
                }
            }
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(project.name.startsWith('mc26.') ? 25 : 21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = project.name.startsWith('mc26.') ? 25 : 21
    }

    if (project.name == "common") {
        tasks.withType(JavaCompile).configureEach {
            enabled = false
        }

        tasks.withType(Jar).configureEach {
            enabled = false
        }

        tasks.matching { it.name == "javadoc" }.configureEach {
            enabled = false
        }

        tasks.named("modrinth").configure {
            enabled = false
        }
    }
}
